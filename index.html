<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jujuy Básquet · Dashboard Interactivo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0f14;--surface:#161920;--surface2:#1e2230;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
    --accent:#e8c84a;--accent2:#4ab8e8;
    --text:#f0eee8;--text2:#9a9890;--text3:#5a5856;
    --green:#4ae87a;--orange:#e87a4a;--red:#e84a4a;
  }
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;line-height:1.5;overflow-x:hidden}
  .app-container{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  
  /* Sidebar */
  aside{background:var(--surface);border-right:1px solid var(--border);padding:2rem;display:flex;flex-direction:column;gap:2rem;position:sticky;top:0;height:100vh}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-0.5px;color:var(--accent);text-transform:uppercase}
  nav{display:flex;flex-direction:column;gap:0.5rem}
  nav button{background:none;border:none;color:var(--text2);text-align:left;padding:0.75rem 1rem;border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:500;transition:0.2s}
  nav button:hover{background:var(--surface2);color:var(--text)}
  nav button.active{background:var(--accent);color:var(--bg);font-weight:700}
  
  /* Main Content */
  main{padding:3rem;max-width:1200px;margin:0 auto;width:100%}
  .header-section{margin-bottom:3rem}
  .header-section h1{font-family:'Barlow Condensed',sans-serif;font-size:3.5rem;font-weight:800;line-height:1;margin-bottom:0.5rem;text-transform:uppercase}
  
  /* Grid de Estadísticas */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem;margin-bottom:3rem}
  .stat-card{background:var(--surface);border:1px solid var(--border);padding:1.5rem;border-radius:12px}
  .stat-label{color:var(--text2);font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;font-family:'DM Mono',monospace}
  .stat-value{font-size:2rem;font-weight:700;font-family:'Barlow Condensed',sans-serif}

  /* Contenedor de Gráficos */
  .charts-container{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:3rem}
  .chart-box{background:var(--surface);padding:1.5rem;border-radius:12px;border:1px solid var(--border);min-height:300px}
  
  .loading{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:1000;font-family:'DM Mono',monospace;color:var(--accent)}
</style>
</head>
<body>

<div id="loader" class="loading">CONECTANDO CON GOOGLE DRIVE...</div>

<div class="app-container">
  <aside>
    <div class="logo">JUJUY BÁSQUET</div>
    <nav id="main-nav">
      <button onclick="changePage('team')" id="btn-team" class="active">EQUIPO (GLOBAL)</button>
      <button onclick="changePage('summary')" id="btn-summary">RESUMEN TÁCTICO</button>
    </nav>
    <div style="margin-top:auto; font-size:0.7rem; color:var(--text3)">
      CONECTADO A: Base Datos E/J<br>ACTUALIZACIÓN EN TIEMPO REAL
    </div>
  </aside>

  <main id="content">
    </main>
</div>

<script>
// CONFIGURACIÓN DE TU DRIVE
const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8pjOI3HpkAbRvA8QkYxor0roEW5EvW2itcENG8zhrxb74J6IFNKYWJzCWzF8p51xJ8FKNYztf-SqI/pub?output=csv';

let P = []; // Jugadores cargados desde Sheets
let page = 'team';
let activePlayerId = null;
let charts = [];

// CARGA DE DATOS DESDE GOOGLE SHEETS
async function init() {
  Papa.parse(SHEETS_URL, {
    download: true,
    header: true,
    complete: function(results) {
      // Filtramos filas vacías y mapeamos tus columnas de Sheets
      P = results.data.filter(row => row.Jugador).map(row => ({
        id: row.Jugador.toLowerCase().replace(/\s/g, ''),
        name: row.Jugador,
        pts: parseFloat(row.PTS) || 0,
        ppp: parseFloat(row.PPP) || 0,
        efg: parseFloat(row['eFG%']) || 0,
        val: parseFloat(row.VAL) || 0,
        min: parseFloat(row.MIN) || 0,
        ts: parseFloat(row['TS%']) || 0,
        per: parseFloat(row['PER%']) || 0
      }));
      
      document.getElementById('loader').style.display = 'none';
      buildNav();
      render();
    }
  });
}

function buildNav() {
  const nav = document.getElementById('main-nav');
  // Limpiar nav de jugadores previos si los hubiera
  const existingPlayerButtons = nav.querySelectorAll('.player-btn');
  existingPlayerButtons.forEach(b => b.remove());

  P.forEach(player => {
    const btn = document.createElement('button');
    btn.className = 'player-btn';
    btn.innerText = player.name.toUpperCase();
    btn.onclick = () => {
      activePlayerId = player.id;
      changePage('player');
    };
    nav.appendChild(btn);
  });
}

function changePage(p) {
  page = p;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  render();
}

function render() {
  const main = document.getElementById('content');
  charts.forEach(c => c.destroy());
  charts = [];

  if (page === 'team') {
    renderTeam(main);
  } else if (page === 'player') {
    const player = P.find(x => x.id === activePlayerId);
    renderPlayer(main, player);
  } else {
    renderSummary(main);
  }
}

function renderTeam(container) {
  const avgEFG = (P.reduce((acc, p) => acc + p.efg, 0) / P.length).toFixed(2);
  const avgPPP = (P.reduce((acc, p) => acc + p.ppp, 0) / P.length).toFixed(2);

  container.innerHTML = `
    <div class="header-section">
      <h1>Rendimiento de Equipo</h1>
      <p style="color:var(--text2)">Promedios acumulados de la temporada basados en Base Datos E/J</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">eFG% Promedio</div><div class="stat-value">${avgEFG}%</div></div>
      <div class="stat-card"><div class="stat-label">PPP Promedio</div><div class="stat-value">${avgPPP}</div></div>
      <div class="stat-card"><div class="stat-label">Jugadores Activos</div><div class="stat-value">${P.length}</div></div>
    </div>

    <div class="charts-container">
      <div class="chart-box"><canvas id="teamChart1"></canvas></div>
      <div class="chart-box"><canvas id="teamChart2"></canvas></div>
    </div>

    <div class="stat-card" style="border-left: 4px solid var(--accent)">
      <h3 style="margin-bottom:1rem; font-family:'Barlow Condensed'">RECOMENDACIÓN TÁCTICA</h3>
      <p style="color:var(--text2)">
        ${avgEFG < 50 ? 'El eFG% global está por debajo del objetivo (50%). Se recomienda priorizar tiros de mayor probabilidad o ajustar la selección de tiro en transición.' : 'Eficiencia ofensiva sólida. Mantener el volumen de juego actual.'}
      </p>
    </div>
  `;

  const ctx1 = document.getElementById('teamChart1').getContext('2d');
  charts.push(new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: P.map(p => p.name),
      datasets: [{ label: 'PPP (Puntos por Posesión)', data: P.map(p => p.ppp), backgroundColor: '#e8c84a' }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#1e2230' } } } }
  }));

  const ctx2 = document.getElementById('teamChart2').getContext('2d');
  charts.push(new Chart(ctx2, {
    type: 'line',
    data: {
      labels: P.map(p => p.name),
      datasets: [{ label: 'eFG% por Jugador', data: P.map(p => p.efg), borderColor: '#4ab8e8', tension: 0.4 }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  }));
}

function renderPlayer(container, p) {
  if(!p) return;
  container.innerHTML = `
    <div class="header-section">
      <h1>${p.name}</h1>
      <p style="color:var(--text2)">Perfil Estadístico Individual</p>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">eFG%</div><div class="stat-value">${p.efg}%</div></div>
      <div class="stat-card"><div class="stat-label">PPP</div><div class="stat-value">${p.ppp}</div></div>
      <div class="stat-card"><div class="stat-label">Valoración</div><div class="stat-value">${p.val}</div></div>
      <div class="stat-card"><div class="stat-label">Minutos</div><div class="stat-value">${p.min}</div></div>
    </div>
    <div class="chart-box" style="margin-bottom:2rem"><canvas id="playerChart"></canvas></div>
  `;
}

function renderSummary(container) {
    container.innerHTML = `<h1>Resumen Táctico</h1><p style="color:var(--text2)">Análisis 360 de la plantilla.</p>`;
}

init();
</script>
</body>
</html>
